name: kalorientracker_flutter
description: "Persönlicher Kalorien- und Makro-Tracker mit KI-Coach."
publish_to: "none"
version: 1.3.1+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2

  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.0

  shared_preferences: ^2.3.4

  http: ^1.2.2

  mobile_scanner: ^6.0.2

  intl: ^0.20.2

  uuid: ^4.5.1

  image_picker: ^1.2.1
  flutter_markdown_plus: ^1.0.12
  fl_chart: ^1.2.0
  file_picker: ^13.4.1
  syncfusion_flutter_pdf: ^35.2.13
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "icon.png"
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0175C2"

flutter:
  uses-material-design: true
